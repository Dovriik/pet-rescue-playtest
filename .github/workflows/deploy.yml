name: Publish Pet Rescue playtest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for complete playtest upload
        id: ready
        run: |
          if test -f playtest-manifest.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for the game bundle upload."
          fi
      - name: Verify bundle and assemble original runtime
        if: steps.ready.outputs.ready == 'true'
        run: python3 assemble_site.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.ready.outputs.ready == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy browser playtest
        id: deployment
        uses: actions/deploy-pages@v5
